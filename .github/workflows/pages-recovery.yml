name: Recover blocked Pages deployment
on:
  push:
    branches: [pages-recovery-20261104]
    paths: [.github/workflows/pages-recovery.yml]
permissions:
  actions: write
  pages: write
jobs:
  cancel-blocked-release:
    if: github.repository == 'Feng96/USBF_site' && github.ref == 'refs/heads/pages-recovery-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Cancel the known blocked workflow and Pages deployment
        env:
          USBF_RECOVERY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ['USBF_RECOVERY_TOKEN']
          base = 'https://api.github.com/repos/Feng96/USBF_site'
          targets = [
              '/actions/runs/41889159768/cancel',
              '/pages/deployments/5242d2c83ff800820e277419aff881aa41649f27/cancel',
          ]
          failures = []
          for target in targets:
              request = urllib.request.Request(
                  base + target, data=b'', method='POST',
                  headers={'Authorization': 'Bearer ' + token,
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(target + ': HTTP ' + str(response.status))
              except urllib.error.HTTPError as error:
                  print(target + ': HTTP ' + str(error.code))
                  # Already finished targets are verified separately before retry.
                  # A missing target or rejected permission must remain a failure.
                  if error.code != 409:
                      failures.append(target)
          if failures:
              raise SystemExit('Cancellation was rejected for: ' + ', '.join(failures))
          PY
